#Name
name : Continuous Deployment (CD) for housing-price-prediction

#Trigger
on : 
    push:
        branches:  ['main']
    pull_request : 
        branches : ['main']

jobs: 
    code-deploy:
        name: Build and deploy docker image
        runs-on : ubuntu-latest

        steps:  
        - name : Checkout repository code
          uses : actions/checkout@v4

        - name : Log into the docker hub
          uses : docker/login-action@v3
          with : 
            username : ${{secrets.DOCKERHUB_USERNAME}}
            password:  ${{secrets.DOCKERHUB_TOKEN}}
        - name:  Set up Docker buildx
          uses : docker/setup-buildx-action@v3
        - name : Build and push docker image
          uses : docker/build-push-action@v5
          with:
            context : ./housing-price-prediction
            file : ./housing-price-prediction/Dockerfile
            push : ${{github.event_name == 'push'}}
            tags : |
              ${{ secrets.DOCKERHUB_USERNAME }}/pyspark-housing-pipeline:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/pyspark-housing-pipeline:${{ github.sha }}

    
    